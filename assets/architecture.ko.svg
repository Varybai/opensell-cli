<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="at ad" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">
  <title id="at">OpenSell architecture — one registry, two surfaces, on-chain settlement</title>
  <desc id="ad">An AI agent connects over MCP stdio and a developer runs subcommands. Both reach opensell-core, which holds the shared 20-tool registry, the REST client, and dispatch. Core calls the OpenSell REST API over HTTPS, and orders settle on-chain in USDC on Arc.</desc>
  <defs>
    <linearGradient id="sTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B44"/><stop offset="1" stop-color="#16297A"/></linearGradient>
    <linearGradient id="sBot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#1E5BFF"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#EDF1F8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B44"/><stop offset="1" stop-color="#15275F"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B1B44" flood-opacity="0.10"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2D0"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3FA971"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#E4EAF2" stroke-width="1.5"/>

  <text x="48" y="52" font-size="13" font-weight="700" letter-spacing="1.2" fill="#5B6B84" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">하나의 레지스트리 · 두 개의 창구 · 온체인 정산</text>

  <g fill="none" stroke="#9FB2D0" stroke-width="2.2">
    <path d="M300 150 L372 150" marker-end="url(#arw)"/>
    <path d="M300 300 L372 300" marker-end="url(#arw)"/>
    <path d="M556 150 C616 150 616 205 660 218" marker-end="url(#arw)"/>
    <path d="M556 300 C616 300 616 245 660 232" marker-end="url(#arw)"/>
    <path d="M904 225 L960 225" marker-end="url(#arw)"/>
  </g>
  <path d="M1060 268 C1060 322 640 300 640 348" fill="none" stroke="#3FA971" stroke-width="2.2" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arwG)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#6B7A94">
    <text x="336" y="143" text-anchor="middle">MCP·stdio</text>
    <text x="336" y="293" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">서브커맨드</text>
    <text x="936" y="216" text-anchor="middle">HTTPS</text>
  </g>

  <g transform="translate(96 118)" filter="url(#soft)">
