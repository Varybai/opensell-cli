      <text x="22" y="78"><tspan fill="#8FB0FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">▸</tspan> REST · 디스패치</text>
    </g>
  </g>

  <g transform="translate(960 190)" filter="url(#soft)">
    <rect x="0" y="0" width="180" height="70" rx="14" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/>
    <text x="20" y="30" font-size="14.5" font-weight="700" fill="#152447">OpenSell</text>
    <text x="20" y="50" font-size="13" fill="#5B6B84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REST API</text>
    <g stroke="#9AA7BD" stroke-width="2" fill="none"><path d="M150 24 v-3 a5 5 0 0 1 10 0 v3"/></g>
    <rect x="147" y="24" width="16" height="12" rx="2.5" fill="#9AA7BD"/><circle cx="155" cy="30" r="1.6" fill="#fff"/>
  </g>

  <g transform="translate(520 348)" filter="url(#soft)">
    <rect x="0" y="0" width="240" height="60" rx="14" fill="#0E7A43"/>
    <circle cx="34" cy="30" r="17" fill="#0B5E33"/>
    <path d="M26 30 l6 6 l12 -13" fill="none" stroke="#7EEBA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="28" font-size="15" font-weight="800" fill="#EAFBF1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Arc · USDC</text>
    <text x="60" y="46" font-size="11.5" fill="#A7E9C4" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">온체인 · usdc_arc</text>
  </g>

  <text x="800" y="392" font-size="13" fill="#5B6B84" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">레지스트리에 도구를 추가하면 →</text>
  <text x="800" y="411" font-size="13" font-weight="700" fill="#2F6BFF" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">CLI와 MCP에 동시에 나타납니다.</text>
</svg>
