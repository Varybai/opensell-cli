    <text x="60" y="47" font-size="12" fill="#5B6B84" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">LLM 런타임</text>
  </g>
  <g transform="translate(96 268)" filter="url(#soft)">
    <rect x="0" y="0" width="204" height="64" rx="14" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/>
