    <rect x="18" y="14" width="9" height="9" rx="2" fill="#7C3AED"/>
    <text x="34" y="23" font-size="11" font-weight="700" letter-spacing="1" fill="#7C3AED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MCP</text>
    <text x="18" y="46" font-size="15.5" font-weight="700" fill="#152447" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">opensell-mcp</text>
  </g>
  <g transform="translate(372 270)" filter="url(#soft)">
    <rect x="0" y="0" width="184" height="60" rx="13" fill="#0C111B"/>
    <circle cx="18" cy="17" r="3.5" fill="#FF5F56"/><circle cx="30" cy="17" r="3.5" fill="#FFBD2E"/><circle cx="42" cy="17" r="3.5" fill="#27C93F"/>
    <text x="18" y="46" font-size="15.5" font-weight="700" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#3FB950">$</tspan> opensell</text>
  </g>

  <g transform="translate(660 180)" filter="url(#soft)">
    <rect x="0" y="0" width="244" height="90" rx="16" fill="url(#navy)"/>
    <text x="22" y="30" font-size="16" font-weight="800" fill="#fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">opensell-core</text>
    <line x1="22" y1="42" x2="222" y2="42" stroke="#2A3B6B" stroke-width="1"/>
    <g font-size="12" fill="#C9D6EE" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif">
