<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">
  <title id="t">OpenSell — agent-facing CLI and MCP server</title>
  <desc id="d">One shared tool registry feeds two surfaces: the opensell CLI and the opensell-mcp server. A developer and an AI agent call the same 20 operations, and orders settle on-chain in USDC on Arc.</desc>
  <defs>
    <linearGradient id="sTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B44"/><stop offset="1" stop-color="#16297A"/></linearGradient>
    <linearGradient id="sBot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#1E5BFF"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#EDF1F8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1B44"/><stop offset="1" stop-color="#15275F"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B1B44" flood-opacity="0.10"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2D0"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3FA971"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="26" fill="url(#bg)" stroke="#E4EAF2" stroke-width="1.5"/>

  <g transform="translate(64 56)">
    <g>
      <path d="M34 2 L61 17 L61 47 L34 62 L7 47 L7 17 Z" fill="#fff" stroke="#DCE3EF" stroke-width="2"/>
      <path d="M45 21 a11 11 0 1 0 -11 13" fill="none" stroke="url(#sTop)" stroke-width="8" stroke-linecap="round"/>
      <path d="M23 43 a11 11 0 1 0 11 -13" fill="none" stroke="url(#sBot)" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="82" y="20" font-size="15" font-weight="600" letter-spacing="1.5" fill="#5B6B84" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">面向智能体的 CLI · MCP 服务器</text>
    <text x="80" y="58" font-size="50" font-weight="800" letter-spacing="-1" fill="#0B1B44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">OpenSell</text>

    <text x="2" y="126" font-size="26" font-weight="600" fill="#152447">一份工具注册表。终端与 AI 智能体</text>
    <text x="2" y="162" font-size="26" font-weight="600" fill="#152447">调用<tspan fill="#2F6BFF">同样的 20 个操作</tspan>，方式完全一致。</text>

    <text x="2" y="202" font-size="16.5" fill="#5B6B84">一个 C2C 市场的客户端，智能体和真人用同一套 API 买卖。</text>

    <g transform="translate(2 230)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600">
      <g><rect x="0" y="0" width="98" height="30" rx="8" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/><text x="49" y="20" text-anchor="middle" fill="#334463">Rust 2021</text></g>
      <g transform="translate(108 0)"><rect x="0" y="0" width="110" height="30" rx="8" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/><text x="55" y="20" text-anchor="middle" fill="#334463">MCP · stdio</text></g>
      <g transform="translate(228 0)"><rect x="0" y="0" width="130" height="30" rx="8" fill="#EAF6EF" stroke="#BFE4CE" stroke-width="1.3"/><circle cx="18" cy="15" r="4" fill="#1F9D57"/><text x="79" y="20" text-anchor="middle" fill="#186B3E">Arc · USDC</text></g>
      <g transform="translate(368 0)"><rect x="0" y="0" width="62" height="30" rx="8" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/><text x="31" y="20" text-anchor="middle" fill="#334463">MIT</text></g>
    </g>
  </g>

