      <text x="20" y="24" font-size="13" font-weight="700" letter-spacing="1.0" fill="#8FB0FF" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">共享注册表</text>
      <text x="20" y="43" font-size="12.5" fill="#C9D6EE" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">20 个工具 · 定义一次</text>
