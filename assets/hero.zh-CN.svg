      <circle cx="16" cy="15" r="3.5" fill="#FF5F56"/><circle cx="28" cy="15" r="3.5" fill="#FFBD2E"/><circle cx="40" cy="15" r="3.5" fill="#27C93F"/>
      <text x="16" y="43" font-size="15" font-weight="700" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#3FB950">$</tspan> opensell</text>
    </g>
    <g transform="translate(245 104)" filter="url(#soft)">
      <rect x="0" y="0" width="150" height="54" rx="13" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/>
      <rect x="16" y="12" width="8" height="8" rx="2" fill="#7C3AED"/>
      <text x="30" y="20" font-size="11.5" font-weight="600" letter-spacing="1" fill="#7C3AED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MCP</text>
      <text x="16" y="43" font-size="15" font-weight="700" fill="#152447" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">opensell-mcp</text>
    </g>
    <g transform="translate(105 196)" filter="url(#soft)">
      <rect x="0" y="0" width="200" height="54" rx="13" fill="#fff" stroke="#E1E8F2" stroke-width="1.3"/>
      <text x="20" y="23" font-size="13.5" font-weight="700" fill="#152447" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">opensell-core</text>
      <text x="20" y="42" font-size="12" fill="#5B6B84" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">REST 客户端 · 分发</text>
    </g>
    <g transform="translate(105 282)" filter="url(#soft)">
      <rect x="0" y="0" width="200" height="54" rx="13" fill="#0E7A43"/>
      <path d="M22 22 l6 6 l12 -13" fill="none" stroke="#7EEBA8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="27" font-size="14.5" font-weight="700" fill="#EAFBF1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Arc · USDC</text>
      <text x="20" y="45" font-size="11.5" fill="#A7E9C4" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif">tx 0x9f3c…a210 · 已结算</text>
    </g>
