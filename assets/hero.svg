<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">OpenSell — agent-facing CLI and MCP server</title>
  <desc id="d">OpenSell: agentic commerce, on chain. The opensell CLI and the opensell-mcp server are how agents plug in, both reading the same tool registry. Orders settle on-chain in USDC on Arc.</desc>
  <defs>
    <linearGradient id="sTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B4F9E"/><stop offset="1" stop-color="#5470D6"/></linearGradient>
    <linearGradient id="sBot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#1E5BFF"/></linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070911"/><stop offset="1" stop-color="#0E1730"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101B3E"/><stop offset="1" stop-color="#1A2A63"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%"><stop offset="0" stop-color="#2F6BFF" stop-opacity="0.20"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59678C"/></marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3FA971"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="378" rx="26" fill="url(#bgDark)" stroke="#1B2542" stroke-width="1.5"/>
  <ellipse cx="600" cy="118" rx="520" ry="200" fill="url(#glow)"/>

  <!-- brand lockup: hex-S + wordmark, centered -->
  <g transform="translate(475 42)">
    <path d="M34 2 L61 17 L61 47 L34 62 L7 47 L7 17 Z" fill="none" stroke="#3A4670" stroke-width="1.6"/>
    <path d="M45 21 a11 11 0 1 0 -11 13" fill="none" stroke="url(#sTop)" stroke-width="7" stroke-linecap="round"/>
    <path d="M23 43 a11 11 0 1 0 11 -13" fill="none" stroke="url(#sBot)" stroke-width="7" stroke-linecap="round"/>
    <text x="82" y="42" font-size="28" font-weight="700" letter-spacing="4" fill="#F3F5FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">OPENSELL</text>
  </g>

  <!-- brand tagline: kept in English across all languages, matching the existing banner.png convention -->
  <text x="600" y="146" font-size="46" font-weight="800" letter-spacing="-0.5" fill="#EEF1FA" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">Agentic Commerce,</text>
  <text x="600" y="200" font-size="46" font-weight="800" letter-spacing="-0.5" fill="#5B8CFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">On Chain.</text>

  <text x="600" y="240" font-size="16.5" fill="#9AA7C7" text-anchor="middle">The opensell CLI and the opensell-mcp server are how agents plug in, both reading the same registry.</text>

  <!-- chips: shared brand/product labels, identical widths across languages -->
  <g transform="translate(600 266)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">
    <g transform="translate(-306 0)"><rect x="0" y="0" width="158" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="79" y="21" fill="#DCE3F5">opensell CLI</text></g>
    <g transform="translate(-140 0)"><rect x="0" y="0" width="158" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="79" y="21" fill="#DCE3F5">opensell-mcp</text></g>
    <g transform="translate(26 0)"><rect x="0" y="0" width="179" height="32" rx="16" fill="#1F9D57" fill-opacity="0.16" stroke="#3FA971" stroke-opacity="0.4"/><circle cx="24" cy="16" r="4" fill="#4ADE80"/><text x="99" y="21" fill="#B7F3CE">Arc settlement</text></g>
    <g transform="translate(213 0)"><rect x="0" y="0" width="93" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="46" y="21" fill="#DCE3F5">USDC</text></g>
  </g>

  <text x="600" y="332" font-size="13" fill="#5C6788" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tx 0x9f3c…a210 · settled on Arc</text>
